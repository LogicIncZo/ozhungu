name: android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: zo-kotlin (composite dep)
        run: |
          git clone --depth 1 https://github.com/LogicIncZo/zo-kotlin.git ../zo-kotlin
      - name: Build
        run: |
          make verify
      - uses: actions/upload-artifact@v4
        with:
          name: ozhungu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
